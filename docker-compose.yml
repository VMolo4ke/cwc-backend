version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coffee_shop_db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:${DATABASE_PORT}'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
